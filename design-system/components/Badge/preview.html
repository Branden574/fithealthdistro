<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Badge preview</title>
<style>
  .demo { display: grid; gap: var(--space-5); padding: var(--space-6); }
  .demo > * { min-width: 0; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var F = window.FHD, h = React.createElement;
  function App() {
    return h('div', { className: 'demo' },
      h('div', { className: 'row' },
        h(F.Badge, { tone: 'accent' }, 'New'),
        h(F.Badge, { tone: 'success', dot: true }, 'In stock'),
        h(F.Badge, { tone: 'warning', dot: true }, 'Low stock'),
        h(F.Badge, { tone: 'danger', dot: true }, 'Out of stock'),
        h(F.Badge, { tone: 'info' }, 'Draft'),
        h(F.Badge, { icon: 'eye-slash' }, 'Hidden'),
        h(F.Badge, { tone: 'solid' }, 'Featured')));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
