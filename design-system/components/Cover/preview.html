<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fit Health Distribution</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  /* the composition: a 480-wide box on the right half of the 960 layout, clear of the name */
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .ink { fill:var(--ink); }
  .volt { fill:var(--accent); }
  .tint { fill:var(--line); }
  .cut { fill:var(--bg); }
  .on { fill:var(--on-accent); }
  .blk { rx:var(--radius-md); }
  .slot { rx:var(--radius-sm); }
  /* name and tagline in flow, pinned by the block's bottom edge */
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-optical-sizing:auto; font-size:72px; line-height:.95; font-weight:900; letter-spacing:.01em; text-transform:uppercase; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ink 240×264 bled off the top (the cabinet, the largest) · accent 224×144 bled off the right edge · line 128×64 (the tint) · ink 80×64 bled off the right edge — ≈39% of 960×288
  arrangement one tall ink slab with satellites, bottoms on one line space-10 above the edge, space-4 gutters
  pattern     tiles, from "vending machines first" and the modular admin: a cabinet's slots, space-10 × space-8 at a space-4 gap, cut out of the slab in bg, two merged two-wide like the components, three stocked in accent; three on-accent slots on the accent block
  scales      sides in space-4 multiples; gutters space-4; tiles space-10 × space-8; blocks radius-md, tiles radius-sm
-->
<rect class="ink blk" x="16" y="-16" width="240" height="264" rx="4"/>
<rect class="volt blk" x="272" y="24" width="224" height="144" rx="4"/>
<rect class="tint blk" x="272" y="184" width="128" height="64" rx="4"/>
<rect class="ink blk" x="416" y="184" width="80" height="64" rx="4"/>
<rect class="cut slot" x="32" y="8" width="40" height="32" rx="2"/>
<rect class="cut slot" x="88" y="8" width="40" height="32" rx="2"/>
<rect class="volt slot" x="144" y="8" width="40" height="32" rx="2"/>
<rect class="cut slot" x="200" y="8" width="40" height="32" rx="2"/>
<rect class="cut slot" x="32" y="56" width="96" height="32" rx="2"/>
<rect class="cut slot" x="144" y="56" width="40" height="32" rx="2"/>
<rect class="cut slot" x="200" y="56" width="40" height="32" rx="2"/>
<rect class="volt slot" x="32" y="104" width="40" height="32" rx="2"/>
<rect class="cut slot" x="88" y="104" width="40" height="32" rx="2"/>
<rect class="cut slot" x="144" y="104" width="40" height="32" rx="2"/>
<rect class="cut slot" x="200" y="104" width="40" height="32" rx="2"/>
<rect class="cut slot" x="32" y="152" width="40" height="32" rx="2"/>
<rect class="cut slot" x="88" y="152" width="40" height="32" rx="2"/>
<rect class="cut slot" x="144" y="152" width="96" height="32" rx="2"/>
<rect class="cut slot" x="32" y="200" width="40" height="32" rx="2"/>
<rect class="cut slot" x="88" y="200" width="40" height="32" rx="2"/>
<rect class="cut slot" x="144" y="200" width="40" height="32" rx="2"/>
<rect class="volt slot" x="200" y="200" width="40" height="32" rx="2"/>
<rect class="on slot" x="288" y="120" width="40" height="32" rx="2"/>
<rect class="on slot" x="344" y="120" width="40" height="32" rx="2"/>
<rect class="on slot" x="400" y="120" width="40" height="32" rx="2"/>
</svg>
</div>
<div class="words">
<h1 class="name">Fit Health Distribution</h1>
<p class="tag">Vending machines, fitness supplements and drinks.</p>
</div>
</div>
</body>
</html>
