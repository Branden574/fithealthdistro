<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon preview</title>
<style>
  .demo { display: grid; gap: var(--space-5); padding: var(--space-6); }
  .demo > * { min-width: 0; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: var(--space-2); }
  .cell { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-1); border: var(--border-thin) solid var(--line); border-radius: var(--radius-sm); }
  .cell span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var F = window.FHD, h = React.createElement;
  function App() {
    return h('div', { className: 'demo' },
      h('div', { className: 'grid' },
        F.Icon.names.map(function (name) {
          return h('div', { className: 'cell', key: name }, h(F.Icon, { name: name, size: 24 }), h('span', null, name));
        })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
