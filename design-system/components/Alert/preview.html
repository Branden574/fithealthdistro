<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alert preview</title>
<style>
  .demo { display: grid; gap: var(--space-5); padding: var(--space-6); }
  .demo > * { min-width: 0; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
  .stack { display: grid; gap: var(--space-3); max-width: 720px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var F = window.FHD, h = React.createElement;
  function App() {
    var state = React.useState(true), open = state[0], setOpen = state[1];
    return h('div', { className: 'demo' },
      h('div', { className: 'stack' },
        open ? h(F.Alert, { tone: 'success', title: 'Product added', onDismiss: function () { setOpen(false); } }, 'Combo vending machine is now in the catalog.') : null,
        h(F.Alert, { tone: 'warning', title: '3 products are low on stock', action: h(F.Button, { size: 'sm' }, 'Review') }, 'Clients can still ask about them.'),
        h(F.Alert, { tone: 'danger', title: 'The product was not saved' }, 'Give it a name and a category, then save again.'),
        h(F.Alert, { tone: 'info' }, 'Online ordering is not switched on yet. Clients send a request and you reply with a quote.')));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
