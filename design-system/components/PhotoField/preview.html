<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PhotoField preview</title>
<style>
  .demo { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-8); padding: var(--space-6); }
  .demo > * { min-width: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var F = window.FHD, h = React.createElement;
  var HINT = 'JPEG, PNG or WebP, up to 5 MB. Shown at 4:3.';
  var PHOTO = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="#1c1c1a"/><rect x="140" y="40" width="120" height="220" rx="8" fill="#d4ff3a"/><rect x="156" y="60" width="88" height="120" fill="#1c1c1a"/></svg>');
  function App() {
    var a = React.useState(null), src = a[0], setSrc = a[1];
    return h('div', { className: 'demo' },
      h(F.PhotoField, { label: 'Photo', hint: HINT, src: src, onSelect: function (file) { setSrc(URL.createObjectURL(file)); }, onRemove: function () { setSrc(null); } }),
      h(F.PhotoField, { label: 'Photo', hint: HINT, src: PHOTO, onSelect: function () {}, onRemove: function () {} }),
      h(F.PhotoField, { label: 'Photo', hint: HINT, src: PHOTO, busy: true, onSelect: function () {} }),
      h(F.PhotoField, { label: 'Photo', hint: HINT, error: 'Pick a JPEG, PNG or WebP photo up to 5 MB.', onSelect: function () {} }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
