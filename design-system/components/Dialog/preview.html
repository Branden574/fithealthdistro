<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialog preview</title>
<style>
  .demo { display: grid; gap: var(--space-5); padding: var(--space-6); }
  .demo > * { min-width: 0; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
  .stage { position: relative; height: 312px; background: var(--bg-subtle); border: var(--border-thin) solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
  .stage > .fhd-btn { margin: var(--space-5); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var F = window.FHD, h = React.createElement;
  function App() {
    var state = React.useState(true), open = state[0], setOpen = state[1];
    function close() { setOpen(false); }
    return h('div', { className: 'demo' },
      h('div', { className: 'stage' },
        h(F.Button, { variant: 'danger', iconLeft: 'trash', onClick: function () { setOpen(true); } }, 'Remove product'),
        h(F.Dialog, {
          open: open, onClose: close, contained: true, size: 'sm',
          title: 'Remove this product?',
          description: 'Combo vending machine, 40 selections will leave the catalog. Inquiries that mention it are kept.',
          footer: h(React.Fragment, null,
            h(F.Button, { onClick: close }, 'Keep it'),
            h(F.Button, { variant: 'danger', onClick: close }, 'Remove product'))
        })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
